name: 'go_annotation'

reader:
  files:
    # Taxon_ids 4932 and 5052 gene annotation files do not reference the taxon id they are named after.
    # Instead, 4932 (cerevisiae) references ceriviseas strain S288C (559292) which is the reference genome assembly strain
    - '../data/9606.go_annotations.gaf.gz'   ### Homo sapiens
    - '../data/10090.go_annotations.gaf.gz'  ### Mus musculus
    - '../data/10116.go_annotations.gaf.gz'  ### Rattus norvegicus
    - '../data/9615.go_annotations.gaf.gz'   ### Canis lupus familiaris
    - '../data/9823.go_annotations.gaf.gz'   ### Sus scrofa
    - '../data/9913.go_annotations.gaf.gz'   ### Bos taurus
    - '../data/9031.go_annotations.gaf.gz'   ### Gallus gallus
    - '../data/7955.go_annotations.gaf.gz'   ### Danio rerio
    - '../data/7227.go_annotations.gaf.gz'   ### Drosophila melanogaster
    - '../data/4932.go_annotations.gaf.gz'   ### Saccharomyces cerevisiae (4932-->559292 downstream when filtering for taxon ids)
    - '../data/4896.go_annotations.gaf.gz'   ### Schizosaccharomyces pombe
    - '../data/6239.go_annotations.gaf.gz'   ### Caenorhabditis elegans
    - '../data/44689.go_annotations.gaf.gz'  ### Dictyostelium discoideum
  format: 'csv'
  delimiter: '\t'
  header_mode: none
  comment_char: '!'
  filters:
    - inclusion: 'include'
      column: 'Taxon'
      filter_code: 'in'
      # The June 2026 GO pipeline migration (geneontology/go-announcements#1153)
      # changed the Taxon column prefix on MOD-native rows from `taxon:` to
      # `NCBITaxon:` in the `-mod` GAF files (MGI, RGD, ZFIN, FlyBase, WormBase,
      # SGD, PomBase, dictyBase). This `in` filter is an exact string match, so
      # both prefixes must be enumerated or those species drop to ~0 edges.
      # The `-uniprot` files (human, dog, cow, pig, chicken) still use `taxon:`.
      value:
        - 'taxon:9606'
        - 'taxon:10090'
        - 'taxon:10116'
        - 'taxon:9615'
        - 'taxon:9823'
        - 'taxon:9913'
        - 'taxon:9031'
        - 'taxon:7955'
        - 'taxon:7227'
        - 'taxon:559292'  ### Saccharomyces cerevisiae S288C Reference genome assembly strain (Majority of annotations from this taxon id > 100,000)
        - 'taxon:4896'
        - 'taxon:6239'
        - 'taxon:44689'
        - 'NCBITaxon:9606'
        - 'NCBITaxon:10090'
        - 'NCBITaxon:10116'
        - 'NCBITaxon:9615'
        - 'NCBITaxon:9823'
        - 'NCBITaxon:9913'
        - 'NCBITaxon:9031'
        - 'NCBITaxon:7955'
        - 'NCBITaxon:7227'
        - 'NCBITaxon:559292'  ### Saccharomyces cerevisiae S288C Reference genome assembly strain (Majority of annotations from this taxon id > 100,000)
        - 'NCBITaxon:4896'
        - 'NCBITaxon:6239'
        - 'NCBITaxon:44689'
  # http://geneontology.org/docs/go-annotation-file-gaf-format-2.2/
  columns:
    - DB
    - DB_Object_ID
    - DB_Object_Symbol
    - Qualifier
    - GO_ID
    - DB_Reference
    - Evidence_Code
    - With_or_From
    - Aspect
    - DB_Object_Name
    - DB_Object_Synonym
    - DB_Object_Type
    - Taxon
    - Date
    - Assigned_By
    - Annotation_Extension
    - Gene_Product_Form_ID

transform:
  mode: 'flat'
  mappings:
    - "./gaf_eco_map.yaml"

writer:
  # Fail the build if the edge count collapses. Healthy full-species builds emit
  # ~3.8M edges; the June 2026 GO format change silently dropped that to ~2.0M
  # before anyone noticed (see the Taxon-prefix note above). This is a coarse
  # whole-graph floor set well above the failure and ~20% below the healthy low,
  # so a catastrophic drop fails loudly without tripping on normal fluctuation.
  # Requires koza with writer count-bound enforcement (monarch-initiative/koza#238).
  min_edge_count: 3000000
  edge_properties:
    - 'id'
    - 'category'
    - 'subject'
    - 'predicate'
    - 'negated'
    - 'has_evidence'
    - 'object'
    - 'species_context_qualifier'
    - 'publications'
    - 'aggregator_knowledge_source'
    - 'primary_knowledge_source'
    - 'knowledge_level'
    - 'agent_type'
